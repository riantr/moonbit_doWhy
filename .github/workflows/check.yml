name: check

run-name: check ${{ github.ref_name }}

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
      TYPOS_VERSION: v1.19.0
      # The toolchain the source is written against. `moon fmt --check` is
      # sensitive to the formatter of the version, so the gate has to run the
      # pinned one: installing "latest" would make the gate depend on
      # whatever the toolchain does that week.
      MOON_VERSION: 0.1.20261028

    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOON_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit version
        run: |
          moon version --all
          moonrun --version
          installed="$(moon version --all | head -1 | awk '{print $2}')"
          if [ "$installed" != "$MOON_VERSION" ]; then
            echo "Expected MoonBit $MOON_VERSION, got $installed" >&2
            exit 1
          fi

      - name: Check package (all 4 backends, --deny-warn)
        run: |
          for target in native wasm wasm-gc js; do
            echo "::group::moon check --target $target --deny-warn"
            moon check --target "$target" --deny-warn
            echo "::endgroup::"
          done

      - name: Test package (all 4 backends, --deny-warn)
        run: |
          for target in native wasm wasm-gc js; do
            echo "::group::moon test --target $target --deny-warn"
            moon test --target "$target" --deny-warn
            echo "::endgroup::"
          done

      - name: Check formatting
        run: moon fmt --check

      - name: Download typos
        run: curl -LsSf https://github.com/crate-ci/typos/releases/download/$TYPOS_VERSION/typos-$TYPOS_VERSION-x86_64-unknown-linux-musl.tar.gz | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Check typos
        run: typos

      - name: Check the README names the released version
        run: python3 .github/scripts/check_readme_sync.py
